name: Playwright Testing CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run API Tests (Cucumber)
        run: npm run cucumber:api
      
      - name: Run API Tests (Playwright)
        run: npx playwright test api-user
      
      - name: Upload API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            cucumber-report.html
            playwright-report/
          retention-days: 30

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run UI Tests (Cucumber)
        run: npm run cucumber:ui
      
      - name: Run UI Tests (Playwright)
        run: npx playwright test complete-checkout
      
      - name: Upload UI Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            cucumber-report.html
            playwright-report/
          retention-days: 30
      
      - name: Upload Test Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

  page-object-tests:
    name: Page Object Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Page Object Tests
        run: |
          npx playwright test RegisterPage
          npx playwright test HomePage
          npx playwright test CartPage
          npx playwright test CheckoutPage
      
      - name: Upload Page Object Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-object-report
          path: playwright-report/
          retention-days: 30

  publish-reports:
    name: Publish Test Reports
    needs: [api-tests, ui-tests, page-object-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Reports
        uses: actions/download-artifact@v4
      
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: reports/${{ github.run_number }}
